name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # If your site requires a Node build step (React/Vite/etc.), uncomment and adjust these:
      #- name: Set up Node.js
      #  uses: actions/setup-node@v4
      #  with:
      #    node-version: '18'
      #
      #- name: Install dependencies
      #  run: npm ci
      #
      #- name: Build site
      #  run: npm run build
      #
      # If you use the build step, change the `path:` below to the build output folder (e.g., ./build or ./dist)

      - name: Upload site contents for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: './'  # change this if your static files are in a subfolder (e.g., ./public or ./build)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
